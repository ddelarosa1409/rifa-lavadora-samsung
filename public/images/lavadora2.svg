<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="knobGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="knobCenter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)" />

  <!-- Panel Base Header -->
  <rect x="60" y="50" width="680" height="490" rx="20" fill="#1E293B" stroke="#334155" stroke-width="2" />

  <!-- Logo and Model -->
  <text x="100" y="110" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="2">SAMSUNG</text>
  <text x="100" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#38BDF8">EcoBubble™ · Digital Inverter 19kg</text>

  <!-- Large Central Selector Knob -->
  <g transform="translate(250, 310)">
    <!-- Outer ring notches -->
    <circle cx="0" cy="0" r="130" fill="#0F172A" stroke="#334155" stroke-width="3" />
    <!-- Indicator dots -->
    <circle cx="0" cy="-105" r="4" fill="#38BDF8" filter="url(#glow)" />
    <text x="0" y="-115" font-family="sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">ALGODÓN</text>
    
    <circle cx="74" cy="-74" r="4" fill="#94A3B8" />
    <text x="105" y="-80" font-family="sans-serif" font-size="10" fill="#94A3B8">LAVADO RÁPIDO</text>

    <circle cx="105" cy="0" r="4" fill="#94A3B8" />
    <text x="120" y="4" font-family="sans-serif" font-size="10" fill="#94A3B8">VAPOR HIGIÉNICO</text>

    <circle cx="74" cy="74" r="4" fill="#94A3B8" />
    <text x="95" y="90" font-family="sans-serif" font-size="10" fill="#94A3B8">EDREDONES</text>

    <circle cx="-74" cy="-74" r="4" fill="#94A3B8" />
    <text x="-105" y="-80" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">SINTÉTICOS</text>

    <circle cx="-105" cy="0" r="4" fill="#94A3B8" />
    <text x="-120" y="4" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">LANA / DELICADO</text>

    <circle cx="-74" cy="74" r="4" fill="#94A3B8" />
    <text x="-95" y="90" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">CENTRIFUGADO</text>

    <!-- Chrome dial body -->
    <circle cx="0" cy="0" r="85" fill="url(#knobGrad)" stroke="#475569" stroke-width="2" />
    <circle cx="0" cy="0" r="76" fill="url(#knobCenter)" />
    
    <!-- Active pointer -->
    <rect x="-3" y="-70" width="6" height="24" rx="3" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="0" cy="0" r="16" fill="#1E293B" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Digital Touch Display Box -->
  <rect x="440" y="150" width="260" height="320" rx="14" fill="#090D16" stroke="#1E293B" stroke-width="2" />

  <!-- Time LED display -->
  <text x="470" y="210" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#64748B">TIEMPO ESTIMADO</text>
  <text x="470" y="270" font-family="monospace" font-size="46" font-weight="900" fill="#38BDF8" filter="url(#glow)">0:45</text>
  <text x="590" y="260" font-family="sans-serif" font-size="13" font-weight="600" fill="#38BDF8">MIN</text>

  <!-- Cycle Options -->
  <g transform="translate(470, 305)">
    <rect x="0" y="0" width="65" height="42" rx="6" fill="#1E293B" stroke="#334155" />
    <text x="32" y="16" font-family="sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">TEMP</text>
    <text x="32" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">40°C</text>

    <rect x="75" y="0" width="65" height="42" rx="6" fill="#1E293B" stroke="#334155" />
    <text x="107" y="16" font-family="sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">ENJUAGUE</text>
    <text x="107" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3x</text>

    <rect x="150" y="0" width="65" height="42" rx="6" fill="#1E293B" stroke="#334155" />
    <text x="182" y="16" font-family="sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">CENTRIF.</text>
    <text x="182" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1400</text>
  </g>

  <!-- Smart Features indicators -->
  <g transform="translate(470, 375)">
    <circle cx="10" cy="10" r="4" fill="#10B981" filter="url(#glow)" />
    <text x="25" y="14" font-family="sans-serif" font-size="11" fill="#E2E8F0">AI Control &amp; SmartThings™</text>

    <circle cx="10" cy="35" r="4" fill="#38BDF8" filter="url(#glow)" />
    <text x="25" y="39" font-family="sans-serif" font-size="11" fill="#E2E8F0">Vapor Desinfectante Activo</text>

    <circle cx="10" cy="60" r="4" fill="#F59E0B" filter="url(#glow)" />
    <text x="25" y="64" font-family="sans-serif" font-size="11" fill="#E2E8F0">Ahorro Energético Inverter A+++</text>
  </g>

  <!-- Tag / Watermark Indicator -->
  <rect x="250" y="555" width="300" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="400" y="572" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">Foto 2: Panel Digital y Selector de Programas</text>
</svg>
